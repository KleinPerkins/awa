{
  "name": "CI",
  "on": {
    "pull_request": {
      "types": [
        "opened",
        "reopened",
        "synchronize",
        "ready_for_review"
      ]
    },
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "ci-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "source-portable": {
      "name": "source-portable",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 70,
      "outputs": {
        "receipt": "${{ steps.verify.outputs.receipt }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c",
          "with": {
            "python-version": "3.14.6"
          }
        },
        {
          "id": "verify",
          "name": "Run source-portable",
          "env": {
            "CI_HEAD_SHA": "${{ github.event.pull_request.head.sha }}",
            "CI_BASE_SHA": "${{ github.event.pull_request.base.sha }}"
          },
          "run": "python3 -I -B scripts/verify.py shard --shard source-portable"
        }
      ],
      "if": "${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}"
    },
    "source-native": {
      "name": "source-native",
      "runs-on": "macos-15",
      "timeout-minutes": 70,
      "outputs": {
        "receipt": "${{ steps.verify.outputs.receipt }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c",
          "with": {
            "python-version": "3.15.2"
          }
        },
        {
          "id": "verify",
          "name": "Run source-native",
          "env": {
            "CI_HEAD_SHA": "${{ github.event.pull_request.head.sha }}",
            "CI_BASE_SHA": "${{ github.event.pull_request.base.sha }}"
          },
          "run": "python3 -I -B scripts/verify.py shard --shard source-native"
        }
      ],
      "if": "${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}"
    },
    "install-fixture": {
      "name": "install-fixture",
      "runs-on": "macos-15",
      "timeout-minutes": 70,
      "outputs": {
        "receipt": "${{ steps.verify.outputs.receipt }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c",
          "with": {
            "python-version": "3.14.6"
          }
        },
        {
          "id": "verify",
          "name": "Run install-fixture",
          "env": {
            "CI_HEAD_SHA": "${{ github.event.pull_request.head.sha }}",
            "CI_BASE_SHA": "${{ github.event.pull_request.base.sha }}"
          },
          "run": "python3 -I -B scripts/verify.py shard --shard install-fixture"
        }
      ],
      "if": "${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}"
    },
    "dashboard": {
      "name": "dashboard",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "outputs": {
        "receipt": "${{ steps.verify.outputs.receipt }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c",
          "with": {
            "python-version": "3.14.6"
          }
        },
        {
          "id": "verify",
          "name": "Run dashboard",
          "env": {
            "CI_HEAD_SHA": "${{ github.event.pull_request.head.sha }}",
            "CI_BASE_SHA": "${{ github.event.pull_request.base.sha }}"
          },
          "run": "python3 -I -B scripts/verify.py shard --shard dashboard"
        }
      ],
      "if": "${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}"
    },
    "router-seam": {
      "name": "router-seam",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "outputs": {
        "receipt": "${{ steps.verify.outputs.receipt }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c",
          "with": {
            "python-version": "3.14.6"
          }
        },
        {
          "name": "Require exact owner-reviewed accessible router binding",
          "id": "router",
          "run": "python3 -I -B scripts/verify.py router-binding",
          "env": {
            "CI_READ_TOKEN": "${{ github.token }}"
          }
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "${{ steps.router.outputs.repository }}",
            "ref": "${{ steps.router.outputs.revision }}",
            "path": "ci-router-source",
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "id": "verify",
          "name": "Run router-seam",
          "env": {
            "CI_HEAD_SHA": "${{ github.event.pull_request.head.sha }}",
            "CI_BASE_SHA": "${{ github.event.pull_request.base.sha }}",
            "AWA_CI_ROUTER_PATH": "${{ github.workspace }}/ci-router-source",
            "CI_READ_TOKEN": "${{ github.token }}"
          },
          "run": "python3 -I -B scripts/verify.py shard --shard router-seam"
        }
      ],
      "if": "${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}"
    },
    "review-admission": {
      "name": "review-admission",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "outputs": {
        "receipt": "${{ steps.verify.outputs.receipt }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c",
          "with": {
            "python-version": "3.14.6"
          }
        },
        {
          "id": "verify",
          "name": "Run review-admission",
          "env": {
            "CI_HEAD_SHA": "${{ github.event.pull_request.head.sha }}",
            "CI_BASE_SHA": "${{ github.event.pull_request.base.sha }}"
          },
          "run": "python3 -I -B scripts/verify.py shard --shard review-admission"
        }
      ],
      "if": "${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}"
    },
    "ci-required": {
      "name": "ci-required",
      "needs": [
        "source-portable",
        "source-native",
        "install-fixture",
        "dashboard",
        "router-seam",
        "review-admission"
      ],
      "if": "${{ always() }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c",
          "with": {
            "python-version": "3.14.6"
          }
        },
        {
          "name": "Require every exact-run lane including native and non-skipped seam",
          "env": {
            "CI_HEAD_SHA": "${{ github.event.pull_request.head.sha }}",
            "CI_BASE_SHA": "${{ github.event.pull_request.base.sha }}",
            "CI_NEEDS": "${{ toJSON(needs) }}"
          },
          "run": "python3 -I -B scripts/verify.py aggregate"
        }
      ]
    }
  }
}
