name: ci
# CI for the AWA engine: run the full test suite (kernel + engine core, includes the
# zero-link preflight) on every push/PR and on release tags. stdlib + sqlite3 only —
# no third-party deps to install. The suite builds scratch git repos in the system temp
# dir (committing with an inline identity), so no global git config is required.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Least privilege: read-only test runner; no write scopes required.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      # SHA-pinned (supply-chain hardening): tags are mutable, full commit SHAs are immutable.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the engine test suite
        run: make test
